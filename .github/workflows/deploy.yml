name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "deprecated/**"
      - "**.md"
  workflow_dispatch: {}

# Permisos mínimos para publicar en Pages vía OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; cancela los en cola (no el en curso).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build # prebuild genera lib/planner/data.json; next build (output: export) → out/
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
