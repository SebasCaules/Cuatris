[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuatris"
version = "0.1.0"
description = "Herramientas de datos de Cuatris: contrato, validación, importadores y scraper del SGA"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastjsonschema>=2.19",
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.7"]

[project.scripts]
cuatris = "cuatris.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cuatris*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["../tests/tools"]
